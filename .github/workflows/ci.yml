name: CI

on:
  pull_request:
  push:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- BACKEND ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Backend
        run: |
          cd apps/backend
          dotnet restore

      - name: Build Backend
        run: |
          cd apps/backend
          dotnet build --no-restore --configuration Release

      - name: Test Backend
        run: |
          cd apps/backend
          dotnet test --no-build --verbosity normal

      # ---------- FRONTEND ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/taskhub-frontend/package-lock.json

      - name: Install Frontend deps
        run: |
          cd apps/frontend/taskhub-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd apps/frontend
          npm run build