services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../../apps/backend
    env_file:
      - .env
    environment:
      ConnectionStrings__Default: Host=${DB_HOST};Port=${DB_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ../../apps/frontend/taskhub-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: